[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "RL framework"
version = "1.0.0"
description = "My everyday personal reinforcement learning framework"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # Python 3.13 not yet supported for some deps
dependencies = [
    "accelerate>=1.5.2",
    "alpaca-eval>=0.6.6",
    # No official flash-attn 2.8.3 wheel exists for Torch 2.10; use the
    # community cp312/cu12/Torch 2.10 wheel to avoid source builds on Modal.
    "flash-attn @ https://github.com/lesj0610/flash-attention/releases/download/v2.8.3-cu12-torch2.10-cp312/flash_attn-2.8.3%2Bcu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "math-verify[antlr4-13-2]>=0.7.0",
    "modal>=1.1.0",
    "pytest>=8.3.5",
    "pylatexenc>=2.10",
    "torch",
    "transformers>=4.50.0",
    "typer>=0.15.4",
    "vllm==0.19.1 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "wandb>=0.26.0",
    "xopen>=2.0.2",
]

[project.optional-dependencies]
plots = [
    "wandb>=0.26.0",
]

[tool.setuptools.packages.find]
include = ["experiment*", "utils*"]

[tool.uv]
package = true
no-build-package = ["flash-attn"]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
]
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
testpaths = ["tests"]
markers = [
    "e2e: opt-in tests that load a model and start a real vLLM server",
]
